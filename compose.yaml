services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      LABSCAPE_AUTH_DB: /app/apps/web/data/auth.sqlite
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SEED_NAME: ${SEED_NAME:-}
    ports:
      - "127.0.0.1:3200:3000"
    volumes:
      - auth_data:/app/apps/web/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in Dokploy}
      WEB_ORIGINS: https://labscape.muhfauzan.dev
      TRUST_PROXY: "true"
      PORT: "8080"
    ports:
      - "127.0.0.1:8200:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  auth_data:
